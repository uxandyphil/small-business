# Builds the read-only version of the site and publishes it to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy read-only site to GitHub Pages

on:
  push:
    # Pages only deploys from branches the github-pages environment allows
    # (by default, the repo's default branch), so both are listed here.
    branches: [main, ccr-41fc78f8-r8dau2]
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Builds the database. Today this is the synthetic demo dataset; replace this
      # step with `npm run ingest` once real sources are connected.
      - run: npm run seed
      - run: npm run build:static
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
